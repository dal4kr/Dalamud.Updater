name: Build Updater
on:
  workflow_dispatch:
  push:
  pull_request:
concurrency: build_xl
permissions:
  contents: write

jobs:
  build-release:
    name: Build Release on Windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025-vs2026
    steps:
      #      - uses: nadock/verified_commits_check@f9b330e987c2e7121dfc0230e65cb5751ee5fac9
      - uses: actions/checkout@v1
      - name: Initialize Submodules
        run: git submodule update --init --recursive
      - name: Restore Nuget Packages
        run: |
          dotnet restore
      - name: Define VERSION
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe

          echo "MSBUILD_PATH=$vsPath" >> $env:GITHUB_ENV
      - name: Build DotNet4 for Release
        run: |
          & "$env:MSBUILD_PATH" "$Env:GITHUB_WORKSPACE\Dalamud.Updater.sln" /t:Build /p:Configuration=Release

      - name: Create package
        shell: pwsh
        run: |
          Write-Host "Create Zip package"
          Compress-Archive -Force Dalamud.Updater\bin\Release\net48\Dalamud.Updater.exe .\release.zip  # Recreate the release zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./release.zip
          name: Release ${{ github.ref }}
          prerelease: false

  build:
    name: Build on Windows
    runs-on: windows-2025-vs2026
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v1
      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Restore Nuget Packages
        run: |
          dotnet restore
      - name: Define VERSION
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe

          echo "MSBUILD_PATH=$vsPath" >> $env:GITHUB_ENV
      - name: Build DotNet4 Master
        run: |
          & "$env:MSBUILD_PATH" "$Env:GITHUB_WORKSPACE\Dalamud.Updater.sln" /t:Build /p:Configuration=Release
      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: Updater-artifact
          path: Dalamud.Updater\bin\Release\net48
